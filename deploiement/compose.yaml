# Lancement durci de la version web, depuis la racine du dépôt :
#   docker compose -f deploiement/compose.yaml up -d --build
# Le port n'écoute que sur la machine : place devant un proxy inverse qui assure le HTTPS
# (Caddy, Traefik, nginx…). Sans HTTPS, le navigateur refuse le chiffrement et l'application reste bloquée.
services:
  mon-dossier-sante:
    build:
      context: ..
      dockerfile: deploiement/Dockerfile
    image: mon-dossier-sante
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
