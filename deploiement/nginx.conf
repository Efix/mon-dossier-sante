# Serveur de fichiers statiques, sans aucune logique côté serveur : il n'envoie que des pages
# et ne reçoit jamais de données (lecture seule, méthodes GET et HEAD uniquement).
# Le HTTPS est assuré en amont par le proxy inverse (le chiffrement du navigateur l'exige).
server {
    # IPv4 seulement : Docker désactive souvent IPv6 dans les conteneurs, et le proxy se connecte en IPv4.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    # Redirections relatives : derrière le proxy, le port interne 8080 ne doit pas apparaître.
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain;
    client_max_body_size 1k;
    access_log off;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # « always » : y compris sur les erreurs. Un add_header dans un location remplace ceux d'ici,
    # d'où l'inclusion répétée du même fichier.
    include /etc/nginx/entetes-securite.conf;

    # Accueil et liste des empreintes : toujours revalidés, ils annoncent la dernière version.
    location = / {
        include /etc/nginx/entetes-securite.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location = /SHA256SUMS {
        include /etc/nginx/entetes-securite.conf;
        add_header Cache-Control "no-cache" always;
        default_type text/plain;
    }

    # Une version publiée ne change jamais : mise en cache définitive.
    location ~ "^/v[0-9]+\.[0-9]+\.[0-9]+/$" {
        include /etc/nginx/entetes-securite.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files ${uri}index.html =404;
    }
    location ~ "^/v[0-9]+\.[0-9]+\.[0-9]+$" {
        return 301 $uri/;
    }

    # Tout le reste n'existe pas, y compris /vX.Y.Z/index.html : une seule adresse par version.
    location / {
        return 404;
    }
}
