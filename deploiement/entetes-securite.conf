# En-têtes ajoutés à chaque réponse. La Content-Security-Policy complète (avec l'empreinte du script)
# est dans chaque page ; celle-ci n'ajoute que ce qu'une balise <meta> ne peut pas exprimer.
# Plusieurs politiques se cumulent : la page reste soumise aux deux.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()" always;
