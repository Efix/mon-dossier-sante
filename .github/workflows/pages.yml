# Publie le site sur GitHub Pages : la page d'accueil et chaque version taguée vX.Y.Z, telle que dans le dépôt.
# Le site est reconstruit ici à partir des tags, et seules les versions notées dans versions-publiees.txt,
# avec l'empreinte qui y figure, sont publiées. Rien n'est construit sur un poste personnel.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par empreinte de commit : une étiquette déplacée ne change pas ce qui s'exécute.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Vérifier les sources et les tests
        run: npm run verifier
      - name: Préparer le site
        run: node outils/publier.mjs --registre
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publication/

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
